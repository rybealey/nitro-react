<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" crossorigin="use-credentials" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#000000">
    <meta name="apple-mobile-web-app-title" content="Nitro">
    <meta name="application-name" content="Nitro">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <base href="./">
    <script>
      // pixelrp: the renderer's LegacyExternalInterface calls window[method](...params)
      // for ANY message starting with its key, from any window - so a site
      // holding a reference to this page (one it opened, say) could run code
      // here, in the game's origin, with the player's ticket and asset pass.
      // Only the hotel page framing us has any reason to call in, and only the
      // callbacks the client registers (HabboWebTools.OPENROOM). This runs
      // before any other script and listens in the capture phase, so it sees
      // every message first and stops the rest from reaching the renderer.
      (function () {
        var key = 'Nitro_LegacyExternalInterface';
        var allowed = { openroom: true };
        window.addEventListener('message', function (event) {
          if (typeof event.data !== 'string' || event.data.indexOf(key) !== 0) return;
          var method = null;
          try { method = JSON.parse(event.data.substr(key.length)).method; } catch (e) {}
          var fromHotel = window.parent !== window && event.source === window.parent && event.origin === window.location.origin;
          if (!fromHotel || !Object.prototype.hasOwnProperty.call(allowed, method)) event.stopImmediatePropagation();
        }, true);
      })();
    </script>
    <!-- No web font links: Press Start 2P and Silkscreen (400/700) are bundled
         (src/assets/styles/fonts.scss), and the Google Fonts stylesheet that
         also loaded them only held the page up. No Ubuntu either: chat needs
         the bundled Habbo-modified Ubuntu (symbol glyphs like | -> heart). -->
    <!-- PixelRP FontAwesome kit (Duotone Solid, webfont) - used for the phone
         UI app tile icons (fa-duotone fa-solid fa-...). This is the only FA
         kit on the page: a second (SVG-JS) kit would hijack every <i class=fa>
         and break these webfont glyphs. Deferred: nothing on the first screens
         uses it, and a plain script here stopped the page until it answered. -->
    <script src="https://kit.fontawesome.com/c305b2c178.js" crossorigin="anonymous" defer></script>
    <title>Nitro</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" class="w-100 h-100">
      <!-- pixelrp: on screen from the first byte, in the loading screen's
           colour, until the app takes over (React clears #root as it mounts) -
           instead of a blank page while the bundle downloads. -->
      <div style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #444298; color: rgba(255, 255, 255, 0.75); font: 600 14px/1 system-ui, sans-serif; letter-spacing: 0.08em;">Loading…</div>
    </div>
    <script>
      const NitroConfig = {
        "config.urls": [ './renderer-config.json', './ui-config.json' ],
        "sso.ticket": (new URLSearchParams(window.location.search).get('sso') || null),
        "forward.type": (new URLSearchParams(window.location.search).get('room') ? 2 : -1),
        "forward.id": (new URLSearchParams(window.location.search).get('room') || 0),
        "friend.id": (new URLSearchParams(window.location.search).get('friend') || 0),
      };

      // pixelrp: the ticket is in NitroConfig now - take it out of the address
      // so it isn't left in history or a copied link. Spent at login anyway;
      // a reload goes through /game, which issues a fresh one (App.tsx).
      (function () {
        var params = new URLSearchParams(window.location.search);
        if (!params.has('sso')) return;
        params.delete('sso');
        var query = params.toString();
        history.replaceState(history.state, '', window.location.pathname + (query ? '?' + query : '') + window.location.hash);
      })();
    </script>
    <script type="module" src="./src/index.tsx"></script>
  </body>
</html>
